name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run quality
      - run: pnpm run test:web
      - run: pnpm run vsix
      - run: pnpm run inspect:vsix
      - run: xvfb-run -a pnpm run test:vsix
      - uses: actions/upload-artifact@v6
        with:
          name: quote-switcher-${{ github.sha }}
          path: quote-switcher.vsix
          if-no-files-found: error
